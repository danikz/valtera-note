name: "Release & Build Cross-Platform"

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 libdbus-1-dev

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure updater endpoint is configured
        shell: bash
        run: |
          if grep -q "GANTI-DENGAN-URL-PUBLIK-R2" src-tauri/tauri.conf.json; then
            echo "::error::Endpoint updater di src-tauri/tauri.conf.json masih placeholder — isi dengan URL publik bucket R2."
            exit 1
          fi

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: 'Valtera Note v__VERSION__'
          releaseBody: 'Pembaruan resmi Valtera Note v__VERSION__. Termasuk file installer dan signature pembaruan otomatis.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Repo private → aset GitHub Release tidak bisa diunduh tanpa login, jadi
  # updater membaca latest.json + installer dari bucket Cloudflare R2 publik.
  publish-r2:
    needs: build-tauri
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: appver
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download updater assets from GitHub release
        env:
          TAG: v${{ steps.appver.outputs.version }}
        run: |
          mkdir -p r2 && cd r2
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --clobber
          for name in $(jq -r '.platforms[].url | split("/") | last' latest.json | sort -u); do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --clobber
          done
          # Arahkan URL tiap platform ke R2, bukan ke GitHub.
          jq --arg base "${R2_PUBLIC_URL%/}/$TAG" \
            '.platforms |= map_values(.url = ($base + "/" + (.url | split("/") | last)))' \
            latest.json > latest.r2.json
          cat latest.r2.json

      - name: Upload to Cloudflare R2
        working-directory: r2
        env:
          TAG: v${{ steps.appver.outputs.version }}
        run: |
          for name in $(jq -r '.platforms[].url | split("/") | last' latest.json | sort -u); do
            aws s3 cp "$name" "s3://$R2_BUCKET/$TAG/$name" --endpoint-url "$R2_ENDPOINT"
          done
          # latest.json diunggah terakhir supaya klien tidak pernah melihat URL yang belum ada.
          aws s3 cp latest.r2.json "s3://$R2_BUCKET/latest.json" --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json --cache-control "no-cache, max-age=0"

  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true

      # Keystore rilis tetap (base64 .jks di secret). Tanpa secret, build jatuh
      # ke debug key acak dan APK baru tidak bisa dipasang menimpa versi lama.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 belum diisi — APK ditandatangani debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Android APKs
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Read app version
        id: appver
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Rename APKs
        working-directory: mobile/build/app/outputs/flutter-apk
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "app-$abi-release.apk" "Valtera-Note-${{ steps.appver.outputs.version }}-android-$abi.apk"
          done

      # Repo private → APK di GitHub Release tidak bisa diunduh publik. App
      # Android membaca android/latest.json di R2 untuk notifikasi update.
      - name: Upload APKs to Cloudflare R2
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          VERSION: ${{ steps.appver.outputs.version }}
        run: |
          BUILD=$(sed -n 's/^version: .*+\([0-9]*\).*/\1/p' mobile/pubspec.yaml)
          BASE="${R2_PUBLIC_URL%/}/android"
          OUT=mobile/build/app/outputs/flutter-apk
          # Catatan rilis = bagian versi ini di CHANGELOG.md.
          NOTES=$(awk -v v="## [$VERSION]" 'index($0, v) == 1 {f=1; next} f && /^(## \[|---)/ {exit} f' CHANGELOG.md \
            | sed 's/\*\*//g; s/`//g; s/^### //')

          APKS='{}'
          for abi in arm64-v8a armeabi-v7a x86_64; do
            name="Valtera-Note-$VERSION-android-$abi.apk"
            aws s3 cp "$OUT/$name" "s3://$R2_BUCKET/android/v$VERSION/$name" --endpoint-url "$R2_ENDPOINT" \
              --content-type application/vnd.android.package-archive
            # Link tetap "selalu versi terbaru" untuk dibagikan.
            aws s3 cp "$OUT/$name" "s3://$R2_BUCKET/android/Valtera-Note-android-$abi.apk" --endpoint-url "$R2_ENDPOINT" \
              --content-type application/vnd.android.package-archive --cache-control "no-cache, max-age=0"
            APKS=$(jq --arg abi "$abi" --arg url "$BASE/v$VERSION/$name" '. + {($abi): $url}' <<< "$APKS")
          done

          jq -n --arg version "$VERSION" --argjson build "$BUILD" --arg notes "$NOTES" --argjson apks "$APKS" \
            '{version: $version, build: $build, notes: $notes, apks: $apks}' > android-latest.json
          cat android-latest.json
          # latest.json terakhir supaya app tidak pernah melihat URL yang belum ada.
          aws s3 cp android-latest.json "s3://$R2_BUCKET/android/latest.json" --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json --cache-control "no-cache, max-age=0"

      - name: Wait for release & upload APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.appver.outputs.version }}
        run: |
          # Release dibuat oleh job build-tauri yang paralel — tunggu sampai ada.
          for i in $(seq 1 40); do
            if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release v$VERSION ditemukan."
              break
            fi
            echo "Menunggu release v$VERSION... (percobaan $i/40)"
            sleep 30
          done
          gh release upload "v$VERSION" \
            "mobile/build/app/outputs/flutter-apk/Valtera-Note-$VERSION-android-arm64-v8a.apk" \
            "mobile/build/app/outputs/flutter-apk/Valtera-Note-$VERSION-android-armeabi-v7a.apk" \
            "mobile/build/app/outputs/flutter-apk/Valtera-Note-$VERSION-android-x86_64.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
